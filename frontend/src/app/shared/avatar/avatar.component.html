<span class="avatar" [class.avatar--sm]="size === 'sm'" [class.avatar--lg]="size === 'lg'">
  @switch (icon) {
    @case ('gamepad') {
      <!-- Joystick Gamer -->
      <svg viewBox="0 0 40 40" class="avatar-svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 12h16a8 8 0 0 1 8 8v4a6 6 0 0 1-10 4.2L23 26H17l-3 2.2A6 6 0 0 1 4 24v-4a8 8 0 0 1 8-8z" />
        <line x1="10" y1="19" x2="16" y2="19" />
        <line x1="13" y1="16" x2="13" y2="22" />
        <circle cx="25" cy="18" r="1" fill="currentColor" />
        <circle cx="28" cy="20.5" r="1" fill="currentColor" />
      </svg>
    }
    @case ('headphones') {
      <!-- Auriculares Musicales -->
      <svg viewBox="0 0 40 40" class="avatar-svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 22v-3a12 12 0 0 1 24 0v3" />
        <rect x="6" y="21" width="5" height="9" rx="2.5" fill="currentColor" />
        <rect x="29" y="21" width="5" height="9" rx="2.5" fill="currentColor" />
      </svg>
    }
    @case ('coffee') {
      <!-- Café / Mate Humeante -->
      <svg viewBox="0 0 40 40" class="avatar-svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 16h18v9a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7v-9z" />
        <path d="M27 19h2a4 4 0 0 1 0 8h-2" />
        <path d="M14 8c0 2-2 2-2 4" />
        <path d="M18 7c0 2-2 2-2 5" />
        <path d="M22 8c0 2-2 2-2 4" />
      </svg>
    }
    @case ('flame') {
      <!-- Fueguito / Vibra activa -->
      <svg viewBox="0 0 40 40" class="avatar-svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6c0 6-6 8-6 15a9 9 0 0 0 18 0c0-8-5-11-5-17 0 0-2 2-2 5-2-1-3-3-5-3z" />
        <path d="M20 23c-1.5 0-3 1.2-3 2.8a3 3 0 0 0 6 0c0-1.6-1.5-2.8-3-2.8z" fill="currentColor" />
      </svg>
    }
    @case ('cat') {
      <!-- Michi con bigotes -->
      <svg viewBox="0 0 40 40" class="avatar-svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 25c0 6 5 10 11 10s11-4 11-10v-9l-5 4c-1.8-1.2-3.8-1.8-6-1.8s-4.2.6-6 1.8l-5-4v9z" />
        <circle cx="16" cy="24" r="1.5" fill="currentColor" />
        <circle cx="24" cy="24" r="1.5" fill="currentColor" />
        <path d="M19 28l1 1 1-1" />
        <line x1="7" y1="23" x2="12" y2="24" />
        <line x1="7" y1="27" x2="12" y2="26" />
        <line x1="33" y1="23" x2="28" y2="24" />
        <line x1="33" y1="27" x2="28" y2="26" />
      </svg>
    }
    @case ('ufo') {
      <!-- OVNI espacial -->
      <svg viewBox="0 0 40 40" class="avatar-svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 19c0-3.3 2.7-6 6-6s6 2.7 6 6" />
        <ellipse cx="20" cy="21" rx="14" ry="5" />
        <circle cx="13" cy="21" r="1" fill="currentColor" />
        <circle cx="20" cy="21" r="1" fill="currentColor" />
        <circle cx="27" cy="21" r="1" fill="currentColor" />
        <line x1="13" y1="26" x2="10" y2="31" />
        <line x1="27" y1="26" x2="30" y2="31" />
      </svg>
    }
    @case ('sword') {
      <!-- Espada RPG -->
      <svg viewBox="0 0 40 40" class="avatar-svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="29" y1="11" x2="16" y2="24" />
        <path d="M29 6l5 5-15 15-4 1 1-4 13-17z" />
        <line x1="12" y1="24" x2="18" y2="30" />
        <line x1="13" y1="27" x2="8" y2="32" />
        <circle cx="7" cy="33" r="1.5" fill="currentColor" />
      </svg>
    }
    @case ('ghost') {
      <!-- Fantasma retro -->
      <svg viewBox="0 0 40 40" class="avatar-svg" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 20c0-6 4-11 10-11s10 5 10 11v11l-3-2-3.5 2-3.5-2-3.5 2-3.5-2-3 2V20z" />
        <circle cx="16" cy="18" r="1.5" fill="currentColor" />
        <circle cx="24" cy="18" r="1.5" fill="currentColor" />
      </svg>
    }
    @default {
      {{ initials() }}
    }
  }
</span>
