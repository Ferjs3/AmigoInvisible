<div class="page page--centered">
  <div class="panel">
    <p class="eyebrow">Amigo invisible</p>
    <h1 class="title">Iniciar sesión</h1>

    <form (ngSubmit)="submit()" class="form-stack">
      <label class="form-field">
        <span class="form-label">Usuario</span>
        <input class="form-input" type="text" [(ngModel)]="username" name="username" required />
      </label>

      <label class="form-field">
        <span class="form-label">Contraseña</span>
        <div class="password-field">
          <input
            class="form-input"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
          />
          <button
            type="button"
            (click)="showPassword.set(!showPassword())"
            class="password-toggle"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (showPassword()) {
              <!-- Ojo tachado (ocultar) -->
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                <line x1="2" y1="2" x2="22" y2="22"></line>
              </svg>
            } @else {
              <!-- Ojo normal (mostrar) -->
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
      </label>

      @if (error()) {
        <p class="field-error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="loading()" class="btn btn--primary btn--block">
        {{ loading() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="footer-note">
      ¿No tenés cuenta?
      <a routerLink="/register" queryParamsHandling="preserve" class="link link--primary">Registrate</a>
    </p>
  </div>
</div>
