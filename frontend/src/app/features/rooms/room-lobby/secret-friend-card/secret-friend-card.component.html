<h2 class="section-heading">Le vas a regalar a</h2>

@if (loading()) {
  <p class="hint-text hint-text--lg">Cargando…</p>
} @else if (error()) {
  <p class="hint-text hint-text--lg hint-text--error">{{ error() }}</p>
} @else {
  <div class="reveal-card">
    <span class="reveal-icon">🎁</span>
    <div class="reveal-name" [class.reveal-name--hidden]="!revealed()">
      {{ revealed() ? name() : '• • • • • • • • • •' }}
    </div>
    <button (click)="revealed.set(!revealed())" class="reveal-toggle">
      {{ revealed() ? 'Ocultar' : 'Revelar' }}
    </button>
  </div>
  <div class="assignment-mail">
    <button type="button" class="btn btn--outline" [disabled]="mailing()" (click)="sendMail()">
      {{ mailing() ? 'Enviando…' : 'Enviarme por mail' }}
    </button>
    @if (mailSent()) {
      <p role="status">Te enviamos un enlace a tu correo registrado.</p>
    }
    @if (mailError()) {
      <p class="field-error" role="alert">{{ mailError() }}</p>
    }
  </div>
}
